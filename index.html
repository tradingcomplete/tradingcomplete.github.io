<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Complete - あなたのトレードを完成させる</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
        }
        
        .logo {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .tagline {
            font-size: 1.5em;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .status {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 40px;
        }
        
        .coming-soon {
            font-size: 2em;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        .features {
            text-align: left;
            margin: 30px 0;
        }
        
        .feature {
            margin: 15px 0;
            font-size: 1.1em;
        }
        
        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.2em;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(76,175,80,0.3);
        }
        
        .social {
            margin-top: 40px;
        }
        
        .social a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1.1em;
        }
        
        @media (max-width: 600px) {
            .logo {
                font-size: 2.5em;
            }
            .tagline {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Trading Complete</h1>
        <p class="tagline">あなたのトレードを完成させる</p>
        
        <div class="status">
            <div class="coming-soon">🚀 Coming Soon</div>
            <p style="font-size: 1.2em; margin-bottom: 20px;">2025年秋 リリース予定</p>
            
            <div class="features">
                <div class="feature">✅ トレード記録を簡単に</div>
                <div class="feature">📊 自動分析でパフォーマンス改善</div>
                <div class="feature">📱 スマホ・PCどこでもアクセス</div>
                <div class="feature">🧾 確定申告もサポート</div>
            </div>
        </div>
        
        <a href="mailto:tradingcomplete.jp@gmail.com?subject=Trading Complete 事前登録" class="cta-button">
            最新情報を受け取る
        </a>
        
        <div class="social">
            <a href="https://twitter.com/Compana_Doppio" target="_blank">X (Twitter)</a>
        </div>
    </div>
</body>

</html>
